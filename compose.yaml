services:
  panel:
    image: ${PANEL_IMAGE:-coronel845sagaz/seed-panel:latest}
    restart: unless-stopped
    user: "${PANEL_UID:-1000}:${PANEL_GID:-1000}"
    environment:
      QBT_URL: ${QBT_URL:-http://qbittorrent:8080}
    ports:
      - "${PANEL_BIND_IP:-127.0.0.1}:${PANEL_PORT:-8765}:8080"
    volumes:
      - ./data:/data
      - ./secrets:/run/panel-secrets:ro
    networks:
      - qbittorrent
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

networks:
  qbittorrent:
    name: ${QBT_NETWORK:-qbittorrent_default}
    external: true
