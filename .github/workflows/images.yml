name: Release Docker images
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish
        required: true
        type: string
env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
permissions:
  contents: write
jobs:
  image:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - name: Build and test
        run: docker build -t "seed-panel:$RELEASE_TAG" .
      - name: Export image
        run: docker save "seed-panel:$RELEASE_TAG" | gzip > "seed-panel-$RELEASE_TAG-linux-${{ matrix.arch }}.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.arch }}
          path: seed-panel-*.tar.gz
  release:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: image-*
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$RELEASE_TAG" seed-panel-*.tar.gz --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
